                const result = decrypted.toString(CryptoJS.enc.Utf8);
                if (!result) throw new Error("Chiave errata");
                document.open(); document.write(result); document.close();
            } catch (e) {
                document.body.innerHTML = "<p style='color:red;font-family:sans-serif;'>❌ Decrittazione fallita: " + e.message + "</p>";
            }
        }

        // 1. Prova da query string
        const pms = new URLSearchParams(window.location.search);
        if (pms.has("key")) {
            decryptPage(pms.get("key"));
        } else {
            // 2. Altrimenti ascolta postMessage
            window.addEventListener("message", (e) => {
                if (e.data && typeof e.data === "string") {
                    decryptPage(e.data);
                }
            }, false);
        }
    </script>
    </body>
    </html>
